# Push the Heartside homepage (everything in shopify/) into an UNPUBLISHED copy
# of the Helio theme. Run it from the browser: Actions > "Push homepage to a
# Shopify theme" > Run workflow, then paste the copy's theme ID.
#
# It only adds and updates Heartside files (--nodelete), so every Helio file in
# the copy stays as it is. It refuses to push to the live theme. Publishing is
# Krish's step, in Shopify admin.
#
# Before pushing it saves the theme's templates and section groups as a run
# artifact ("theme-backup-..."), because pushing templates/*.json replaces any
# theme-editor changes to them. Tick "header_memo_bar" to put the HS memo bar at
# the top of the header and retire the v1 offer bar (.github/scripts/header-memo.mjs).
#
# One-time setup (see docs/COWORK-PROMPT.md):
#   Repository secret SHOPIFY_CLI_THEME_TOKEN = a password from Shopify's free
#   Theme Access app. Never commit it or paste it anywhere else.

name: Push homepage to a Shopify theme

on:
  workflow_dispatch:
    inputs:
      theme_id:
        description: "Theme ID of the UNPUBLISHED Helio copy (digits only, from the Customize URL)"
        required: true
        type: string
      theme_name:
        description: "The target theme's exact name. The push stops if it differs."
        required: true
        default: "Heartside launch"
        type: string
      header_memo_bar:
        description: "Also put the HS memo bar at the top of the header and remove the v1 offer bar"
        required: false
        default: false
        type: boolean
      pull_only:
        description: "Only save the theme's current templates, section groups and settings as an artifact. Pushes nothing."
        required: false
        default: false
        type: boolean
      overwrite_editor_edits:
        description: "Push even if the theme has theme-editor edits that aren't in the repo (they are saved in the backup first)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: shopify-theme-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOPIFY_FLAG_STORE: bnf1em-ge.myshopify.com
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      SHOPIFY_CLI_NO_ANALYTICS: "1"
      THEME_ID: ${{ inputs.theme_id }}
      THEME_NAME: ${{ inputs.theme_name }}
    steps:
      - name: Check inputs
        run: |
          if [ -z "$SHOPIFY_CLI_THEME_TOKEN" ]; then
            echo "::error::Repository secret SHOPIFY_CLI_THEME_TOKEN is missing. Add the Theme Access password under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! [[ "$THEME_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::theme_id must be digits only, for example 141234567890."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@3

      - name: Refuse the live theme
        run: |
          shopify theme list --json > themes.json
          role=$(node -e 'const t=require("./themes.json").find(x=>String(x.id)===process.env.THEME_ID); console.log(t ? t.role : "missing")')
          name=$(node -e 'const t=require("./themes.json").find(x=>String(x.id)===process.env.THEME_ID); console.log(t ? t.name : "")')
          echo "Target theme: $THEME_ID \"$name\" (role: $role)"
          if [ "$role" = "missing" ]; then
            echo "::error::No theme with ID $THEME_ID in the store. Check the ID in the Customize URL."
            exit 1
          fi
          if [ "$role" = "live" ] || [ "$role" = "main" ]; then
            echo "::error::Theme $THEME_ID is the LIVE theme. Duplicate Helio and push to the copy instead."
            exit 1
          fi
          if [ "$name" != "$THEME_NAME" ]; then
            echo "::error::Theme $THEME_ID is named \"$name\", not \"$THEME_NAME\". Nothing was pushed."
            exit 1
          fi

      - name: Back up the theme's templates and section groups
        run: |
          mkdir -p backup
          shopify theme pull --theme "$THEME_ID" --path backup --only "templates/*.json" --only "sections/*.json" --only "config/settings_data.json"
          node -e '
            const fs = require("fs"), { execSync } = require("child_process");
            const parse = (t) => { try { return JSON.parse(t.replace(/^\s*\/\*[\s\S]*?\*\//, "")); } catch (e) { return null; } };
            // Shopify adds empty "settings": {} and reorders keys when it saves, so compare the substance
            const norm = (v) => Array.isArray(v) ? v.map(norm) : v && typeof v === "object"
              ? Object.keys(v).sort().reduce((o, k) => { const n = norm(v[k]); if (!(n && typeof n === "object" && !Array.isArray(n) && !Object.keys(n).length)) o[k] = n; return o; }, {})
              : v;
            const key = (v) => JSON.stringify(norm(v));
            for (const f of fs.readdirSync("shopify/templates")) {
              const path = "shopify/templates/" + f;
              const store = fs.existsSync("backup/templates/" + f) ? parse(fs.readFileSync("backup/templates/" + f, "utf8")) : null;
              if (!store) { console.log(`templates/${f}: new to this theme`); continue; }
              // every version of this template that was ever committed, newest first
              const shas = execSync(`git log --format=%H -n 60 -- ${path}`).toString().trim().split("\n").filter(Boolean);
              const known = new Set(shas.map((sha) => { try { return key(parse(execSync(`git show ${sha}:${path}`).toString())); } catch (e) { return ""; } }));
              const now = key(parse(fs.readFileSync(path, "utf8")));
              if (key(store) === now) console.log(`templates/${f}: unchanged`);
              else if (known.has(key(store))) console.log(`templates/${f}: updated from an earlier deploy, no theme-editor edits`);
              else { console.log(`::warning::templates/${f} was edited in the theme editor and the repo does not have those edits yet.`); fs.appendFileSync("editor-edits.txt", f + "\n"); }
            }'

      - uses: actions/upload-artifact@v4
        with:
          name: theme-backup-${{ inputs.theme_id }}-run-${{ github.run_number }}
          path: backup
          retention-days: 30

      - name: Stop if a push would wipe theme-editor edits
        if: ${{ !inputs.pull_only && !inputs.overwrite_editor_edits }}
        run: |
          if [ -s editor-edits.txt ]; then
            echo "::error::These templates have theme-editor edits that aren't in the repo: $(tr '\n' ' ' < editor-edits.txt). Copy them into shopify/templates/ (the theme-backup artifact has them), or rerun with overwrite_editor_edits. Nothing was pushed."
            exit 1
          fi

      - name: Put the memo bar at the top of the header
        if: ${{ inputs.header_memo_bar && !inputs.pull_only }}
        run: |
          if [ ! -f backup/sections/header-group.json ]; then
            echo "::error::The theme has no sections/header-group.json, so the header was left alone."
            exit 1
          fi
          cp backup/sections/header-group.json shopify/sections/header-group.json
          node .github/scripts/header-memo.mjs shopify/sections/header-group.json

      - name: Push Heartside files into the copy
        if: ${{ !inputs.pull_only }}
        run: |
          set -o pipefail
          shopify theme push --theme "$THEME_ID" --path shopify --nodelete --ignore "preview/*" --ignore "README.md" 2>&1 | tee push.log
          # The CLI exits 0 even when Shopify rejects files, so read its report
          if grep -q -e "pushed with errors" -e "─ error" push.log; then
            echo "::error::Shopify rejected one or more files (see the error boxes above). The theme is partly updated."
            exit 1
          fi

      - name: Summary
        if: success()
        run: |
          {
            if [ "${{ inputs.pull_only }}" = "true" ]; then echo "### Saved theme $THEME_ID (nothing pushed)"; else echo "### Pushed to theme $THEME_ID"; fi
            echo ""
            echo "Open Shopify admin > Online Store > Themes > the copy > Customize to finish setup."
            echo "The theme's templates and section groups from before this push are saved under Artifacts."
            echo "Preview: https://bnf1em-ge.myshopify.com/?preview_theme_id=$THEME_ID"
          } >> "$GITHUB_STEP_SUMMARY"
